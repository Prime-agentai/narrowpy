[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrowpy"
version = "0.1.0"
description = "Deep modules, narrow interfaces: a structural linter and agent gate for Python. Finds module cycles (including the ones agents hide with function-local imports), field leaks, tangles and shallow modules, and blocks Claude Code from stopping when it made the structure worse. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prime-agentai" }]
keywords = ["linter", "architecture", "static-analysis", "code-quality", "coding-agents", "claude-code", "ai-slop", "circular-imports", "software-design", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
narrowpy = "narrowpy.cli:main"

[project.urls]
Homepage = "https://github.com/Prime-agentai/narrowpy"
Issues = "https://github.com/Prime-agentai/narrowpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narrowpy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]
